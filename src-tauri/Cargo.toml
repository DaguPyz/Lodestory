[package]
name = "lodestory"
version = "0.1.0"
description = "Lodestory desktop application"
edition = "2021"

[lib]
name = "lodestory_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4", features = ["serde"] }
dunce = "1"
font-kit = "0.14.3"
libloading = "0.7.4"
percent-encoding = "2"
same-file = "1"
rustix = { version = "1.1.5", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
semver = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[features]
desktop-e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver", "tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
