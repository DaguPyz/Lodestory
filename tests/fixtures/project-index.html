<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lodestory 项目入口测试</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      // Development-only IPC fixture. No native directory or index is modified.
      import { mockIPC, mockWindows } from "@tauri-apps/api/mocks";
      const scenario = new URLSearchParams(location.search).get("scenario");
      const documentFiles = new Map([["正文/已有章节.md", "这是已有文稿。"], ["故事大纲.txt", "故事的大纲。"]]);
      const documentFolders = ["正文", "资料"];
      const parentOf = (path) => path.includes("/") ? path.slice(0, path.lastIndexOf("/")) : "";
      function documentTree(parent = "") {
        return [
          ...documentFolders.filter((path) => parentOf(path) === parent).map((path) => ({ path, name: path.split("/").at(-1), children: documentTree(path) })),
          ...[...documentFiles.keys()].filter((path) => parentOf(path) === parent).map((path) => ({ path, name: path.split("/").at(-1) })),
        ];
      }
      let records = [
        { id: "66c64727-ddb5-4bd6-b8cc-b029b57bde2c", name: "测试故事", path: "/tmp/lodestory-ui/测试故事", lastOpenedAt: new Date().toISOString(), available: true },
        { id: "afc7f0f5-1dc4-46a1-988c-a9b4ef69c6e1", name: "已移动故事", path: "/tmp/lodestory-ui/旧位置", lastOpenedAt: "2026-09-25T01:41:00Z", available: false },
      ];
      window.isTauri = true;
      mockWindows("main");
      mockIPC(async (command, args) => {
        if (command.startsWith("plugin:")) return command === "plugin:window|theme" ? "Dark" : 1;
        if (command === "list_documents") return documentTree();
        if (command === "create_document") {
          if (scenario === "create-error") throw { code: "document_create_failed", message: "创建文档失败：保存目录不可写。" };
          if (/[<>:"/\\|?*]/.test(args.name) || args.name.startsWith(".")) throw { code: "invalid_document_name", message: "文档名称不能包含路径分隔符或特殊字符。" };
          const name = /\.(md|markdown|txt)$/i.test(args.name) ? args.name : `${args.name}.md`;
          const path = args.parentPath ? `${args.parentPath}/${name}` : name;
          if (documentFiles.has(path)) throw { code: "document_exists", message: "已存在同名文档，请换一个名称。" };
          documentFiles.set(path, "");
          return { path, fileName: name, content: "" };
        }
        if (command === "read_document") {
          if (!documentFiles.has(args.path)) throw { code: "document_unavailable", message: "文档已被移除。" };
          return { path: args.path, fileName: args.path.split("/").at(-1), content: documentFiles.get(args.path) };
        }
        if (command === "save_document") {
          if (scenario === "save-error") throw { code: "document_save_failed", message: "保存文档失败：磁盘不可写。" };
          if (scenario === "slow-save") await new Promise((resolve) => setTimeout(resolve, 200));
          if (documentFiles.get(args.path) !== args.expectedContent) throw { code: "document_changed", message: "文档已被其他程序修改。" };
          documentFiles.set(args.path, args.content);
          return;
        }
        if (scenario === "corrupt") throw { code: "invalid_index", message: "项目索引格式错误，原文件已保留。" };
        if (command === "list_recent_projects") return records;
        if (command === "pick_project_directory") {
          if (scenario === "cancel") return null;
          return args.title.startsWith("重新定位") ? "/tmp/lodestory-ui/新位置" : "/tmp/lodestory-ui";
        }
        if (command === "remove_recent_project") {
          records = records.filter((record) => record.id !== args.id);
          return records;
        }
        const path = command === "create_project" ? `${args.parentPath}/${args.name}` : args.path;
        const existing = records.find((record) => record.id === args.id || record.path === path);
        const project = {
          id: existing?.id ?? crypto.randomUUID(),
          name: path.slice(path.lastIndexOf("/") + 1),
          path,
          lastOpenedAt: new Date().toISOString(),
          available: true,
        };
        records = [project, ...records.filter((record) => record.id !== project.id && record.path !== path)];
        const { available: _available, ...opened } = project;
        return { project: opened, projects: records };
      }, { shouldMockEvents: true });
      await import("/src/main.tsx");
    </script>
  </body>
</html>
