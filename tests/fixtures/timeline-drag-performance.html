<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timeline drag performance browser fixture</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="stylesheet" href="/src/plugins/timeline/timeline.css" />
    <style>
      * { box-sizing: border-box; }
      html, body, #root { margin: 0; width: 1200px; height: 720px; overflow: hidden; }
      body { background: var(--ui-surface-workspace); color: var(--ui-text-primary); }
      #root, .fixture-host { display: flex; width: 1200px; height: 720px; }
      .timeline-canvas-frame { width: 1200px; height: 720px; flex: none; }
    </style>
  </head>
  <body>
    <main id="root"></main>
    <script type="module">
      import React from "react";
      import {createRoot} from "react-dom/client";
      import {CanvasSurface} from "/src/plugins/canvas/CanvasSurface.tsx";
      import {createCanvasViewport} from "/src/plugins/canvas/createCanvasViewport.ts";
      import {TimelineCanvas} from "/src/plugins/timeline/TimelineCanvas.tsx";
      import {ContextMenuProvider} from "/src/plugins/context-menu/ContextMenuProvider.tsx";
      import {ContextMenuRegion} from "/src/plugins/context-menu/ContextMenuRegion.tsx";

      document.documentElement.dataset.uiThemeId = "lodestory.builtin.dark";
      const targetAssetIds = ["20000000-0000-4000-8000-000000000099"];
      const makeId = value => `00000000-0000-4000-8000-${String(value).padStart(12, "0")}`;
      const denseEvents = Array.from({length: 1000}, (_, index) => ({
        id: makeId(index + 1), title: `Dense ${String(index).padStart(4, "0")}`,
        summary: index % 3 === 0 ? "密集事件摘要" : "", offset: -2 + 4 * index / 999,
        placement: index % 2 === 0 ? "above" : "below", important: index % 2 === 0, assetIds: [],
      }));
      const sparseEvents = Array.from({length: 10000}, (_, index) => ({
        id: makeId(index + 1001), title: `Sparse ${String(index).padStart(5, "0")}`,
        summary: "稀疏事件", offset: (index - 5000) * 10,
        placement: index % 2 === 0 ? "above" : "below", important: index % 3 === 0, assetIds: [],
      }));
      const targetEvent = {
        ...sparseEvents[9999], title: "Sparse beyond 2048", offset: 27,
        placement: "above", important: true, assetIds: [...targetAssetIds],
      };
      sparseEvents[9999] = targetEvent;
      let events = [...denseEvents, ...sparseEvents];
      const allEvents = events;
      let saves = 0;
      const eventListeners = new Set();
      let eventSnapshot = {events, loaded: true, loading: false, saving: false, dirty: false,
        pendingCreate: false, error: null, blocked: false, saveState: "saved"};
      const publishEvents = () => {
        eventSnapshot = {...eventSnapshot, events};
        for (const listener of [...eventListeners]) listener();
      };
      const eventStore = {
        getSnapshot: () => eventSnapshot,
        subscribe(listener) { eventListeners.add(listener); return () => eventListeners.delete(listener); },
        async load() { return true; },
        async upsert(next) {
          saves++;
          events = events.map(event => event.id === next.id ? {...next, assetIds: [...next.assetIds]} : event);
          publishEvents();
          return true;
        },
        async remove(id) { events = events.filter(event => event.id !== id); publishEvents(); return true; },
        async retry() { return true; },
        dispose() {},
      };
      const axisSettings = {origin: 0, step: 1, unit: "天"};
      const axisListeners = new Set();
      let axisSnapshot = {settings: axisSettings, loaded: true, loading: false, saving: false,
        dirty: false, pendingCreate: false, error: null, blocked: false, saveState: "saved"};
      const axisStore = {
        getSnapshot: () => axisSnapshot,
        subscribe(listener) { axisListeners.add(listener); return () => axisListeners.delete(listener); },
        async load() { return true; },
        async update(settings) {
          axisSnapshot = {...axisSnapshot, settings: {...settings}};
          for (const listener of [...axisListeners]) listener();
          return true;
        },
        async retry() { return true; },
        dispose() {},
      };
      const relatedAssets = [
        {id: targetAssetIds[0], name: "林舟", typeId: "person", description: "归乡的旅人"},
        {id: makeId(21000), name: "旧街", typeId: "place", description: "阔别多年的故乡"},
        {id: makeId(21002), name: "陈师傅", typeId: "person", description: "旧街上的修表匠"},
        {id: makeId(21003), name: "方晴", typeId: "person", description: "从南方回来的学徒"},
        {id: makeId(21004), name: "闻溪", typeId: "person", description: "旅人的旧友"},
        {id: makeId(21005), name: "渡口", typeId: "place", description: "两人分别的地方"},
        {id: makeId(21006), name: "守溪会", typeId: "faction", description: "在渡口帮忙的人"},
        {id: makeId(21007), name: "造钟行", typeId: "faction", description: "旧街上的行会"},
      ];
      const catalogSnapshot = {
        assets: relatedAssets,
        types: [{id: "place", name: "地点", status: "active"}, {id: "faction", name: "势力", status: "active"},
          {id: "person", name: "人物", status: "active"}],
        loaded: true, loading: false, blocked: false, error: null,
      };
      const assetCatalog = {getSnapshot: () => catalogSnapshot, subscribe: () => () => {}, async retry() { return true; }};
      const student = relatedAssets[0];
      const teacher = relatedAssets[2];
      const enemy = relatedAssets[4];
      const assetRelationsSnapshot = {loaded: true, loading: false, saving: false, pending: false, error: null};
      const savedRelations = [
        {assets: [{assetsId: student.id, tag: "徒弟"}, {assetsId: teacher.id, tag: "师父"}], label: "师徒"},
        {assets: [{assetsId: enemy.id}, {assetsId: student.id}], label: "死敌"},
        {assets: [{assetsId: teacher.id}, {assetsId: student.id}], label: "传授功法"},
      ];
      const assetRelations = {
        getSnapshot: () => assetRelationsSnapshot,
        subscribe: () => () => {},
        getRelations: id => savedRelations.filter(relation => relation.assets.some(asset => asset.assetsId === id)),
      };
      const canvas = {Surface: CanvasSurface};
      const contextMenus = {Region: ContextMenuRegion};
      const root = createRoot(document.querySelector("#root"));
      let viewport = createCanvasViewport();
      let active = true;
      let openToken = null;
      let mounted = true;
      let showRelations = false;
      const oldViewports = [];
      function render() {
        root.render(mounted ? React.createElement(ContextMenuProvider, null, React.createElement("div", {className: "fixture-host"},
          React.createElement(TimelineCanvas, {canvas, contextMenus, assetCatalog, viewport,
            assetRelations: showRelations ? assetRelations : null,
            active, title: "性能回归", axis: axisStore, events: eventStore, openToken}))) : null);
      }
      render();

      window.__timelineDragFixture = {
        state() {
          const view = viewport.getSnapshot();
          const current = events.find(event => event.id === targetEvent.id);
          return {center: {...view.center}, zoom: view.zoom, disposed: view.disposed,
            eventCount: events.length, saves, target: current ? {...current, assetIds: [...current.assetIds]} : null,
            targetIndex: events.findIndex(event => event.id === targetEvent.id)};
        },
        setView(center, zoom = 1) {
          viewport.resetView();
          viewport.zoomTo(zoom);
          viewport.panBy(-center.x * zoom, -center.y * zoom);
        },
        setActive(next) { active = next; render(); },
        showRelations(next) { showRelations = next; render(); },
        open(next) { openToken = next; render(); },
        setAnimationEvents(enabled) {
          events = enabled ? denseEvents.filter((_, index) => index % 25 === 0) : allEvents;
          publishEvents();
        },
        setFocusAssets(enabled, missing = 0, known = relatedAssets.length) {
          const ids = relatedAssets.slice(0, known).map(asset => asset.id).concat(Array.from({length: missing}, (_, index) => makeId(22000 + index)));
          events = events.map(event => event.id === targetEvent.id
            ? {...event, assetIds: enabled ? ids : [...targetAssetIds]} : event);
          publishEvents();
        },
        replaceViewport() {
          const oldViewport = viewport;
          oldViewports.push(oldViewport);
          viewport = createCanvasViewport();
          render();
          return oldViewports.length - 1;
        },
        oldViewportState(index) {
          const view = oldViewports[index]?.getSnapshot();
          return view ? {center: {...view.center}, zoom: view.zoom, disposed: view.disposed} : null;
        },
        unmount() { mounted = false; root.render(null); },
        eventCount() { return eventSnapshot.events.length; },
        saveCount() { return saves; },
        targetId() { return targetEvent.id; },
      };
      window.__timelineDragReadyAt = performance.now();
    </script>
  </body>
</html>
