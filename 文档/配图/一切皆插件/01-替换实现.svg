</style><rect x="0" y="0" width="1000" height="620" rx="16" fill="#fff" stroke="#dde3ec" stroke-width="1.6"/><text x="40" y="56" font-size="29" text-anchor="start" style="fill:#20304a;font-weight:600">先解决替换：把写入函数交给调用者选择</text><text x="40" y="92" font-size="19" text-anchor="start" style="fill:#5d6a7e;font-weight:400">此时只需要函数参数，还没有 Core、注册表或插件。</text><text x="50" y="150" font-size="22" text-anchor="start" style="fill:#20304a;font-weight:600">原来：实现写在保存函数内部</text><rect x="50" y="180" width="350" height="100" rx="12" fill="#edf3ff" stroke="#426baa" stroke-width="1.6"/><text x="225.0" y="222.2" font-size="22" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="326">saveDocument(document)</text><text x="225.0" y="253.2" font-size="22" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="326">await writeToFile(document)</text><rect x="660" y="180" width="290" height="100" rx="12" fill="#eaf6ee" stroke="#33825d" stroke-width="1.6"/><text x="805.0" y="222.2" font-size="22" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="266">writeToFile</text><text x="805.0" y="253.2" font-size="22" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="266">写入文件</text><path class="edge" d="M400 230 L660 230" stroke="#65758d" marker-end="url(#arrowink)"/><rect x="487.0" y="195" width="86" height="27" rx="4" fill="#fff" stroke="none" stroke-width="1.6"/><text x="530" y="212" font-size="18" text-anchor="middle" style="fill:#65758d;font-weight:400">固定调用</text><line x1="40" y1="315" x2="960" y2="315" stroke="#dce3ed" stroke-width="1.5"/><text x="50" y="353" font-size="22" text-anchor="start" style="fill:#20304a;font-weight:600">现在：调用者把选中的函数作为 write 参数传入</text><rect x="50" y="420" width="225" height="100" rx="12" fill="#f5f7fa" stroke="#7c8798" stroke-width="1.6"/><text x="162.5" y="462.2" font-size="22" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="201">调用者</text><text x="162.5" y="493.2" font-size="22" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="201">选择写入办法</text><rect x="385" y="385" width="265" height="80" rx="12" fill="#eaf6ee" stroke="#33825d" stroke-width="1.6"/><text x="517.5" y="432.7" font-size="22" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="241">writeToFile</text><rect x="385" y="495" width="265" height="80" rx="12" fill="#eaf6ee" stroke="#33825d" stroke-width="1.6"/><text x="517.5" y="542.7" font-size="22" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="241">writeToMemory</text><rect x="775" y="420" width="175" height="100" rx="12" fill="#edf3ff" stroke="#426baa" stroke-width="1.6"/><text x="862.5" y="463.0" font-size="20" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="151">保存流程</text><text x="862.5" y="491.0" font-size="20" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="151">await write(...)</text><path class="edge" d="M275 445 L330 445 L330 425 L385 425" stroke="#65758d" marker-end="url(#arrowink)"/><rect x="303.0" y="384" width="50" height="27" rx="4" fill="#fff" stroke="none" stroke-width="1.6"/><text x="328" y="401" font-size="18" text-anchor="middle" style="fill:#65758d;font-weight:400">正常</text><path class="edge" d="M275 495 L330 495 L330 535 L385 535" stroke="#65758d" marker-end="url(#arrowink)"/><rect x="305.0" y="549" width="50" height="27" rx="4" fill="#fff" stroke="none" stroke-width="1.6"/><text x="330" y="566" font-size="18" text-anchor="middle" style="fill:#65758d;font-weight:400">测试</text><path class="edge" d="M650 425 L710 425 L710 445 L775 445" stroke="#65758d" marker-end="url(#arrowink)"/><rect x="689.0" y="385" width="50" height="27" rx="4" fill="#fff" stroke="none" stroke-width="1.6"/><text x="714" y="402" font-size="18" text-anchor="middle" style="fill:#65758d;font-weight:400">传入</text><path class="edge" d="M650 535 L710 535 L710 495 L775 495" stroke="#65758d" marker-end="url(#arrowink)"/><text x="40" y="592" font-size="19" text-anchor="start" style="fill:#5d6a7e;font-weight:400" data-max-width="920">两条分支是两种使用场景；保存流程始终只调用传入的 write。</text></svg>