<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="625" viewBox="0 0 1000 625" role="img" aria-labelledby="title desc">
<title id="title">把“建立关系”和“执行保存”分成两个时刻</title><desc id="desc">上半部分在启动时运行；下半部分等用户点击保存才运行。</desc>
<defs><marker id="arrowink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#65758d"/></marker><marker id="arrowblue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#426baa"/></marker><marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#33825d"/></marker><marker id="arrowamber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#ac7825"/></marker><marker id="arrowpurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#7954a7"/></marker><marker id="arrowred" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#b64b58"/></marker><marker id="arrowgray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#7c8798"/></marker></defs><style>
text {font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill:#20304a;}
.heading {font-weight:600;} .edge {fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round;}
</style><rect x="0" y="0" width="1000" height="625" rx="16" fill="#fff" stroke="#dde3ec" stroke-width="1.6"/><text x="40" y="56" font-size="29" text-anchor="start" style="fill:#20304a;font-weight:600">把“建立关系”和“执行保存”分成两个时刻</text><text x="40" y="92" font-size="19" text-anchor="start" style="fill:#5d6a7e;font-weight:400">上半部分在启动时运行；下半部分等用户点击保存才运行。</text><text x="50" y="151" font-size="23" text-anchor="start" style="fill:#20304a;font-weight:600">启动时</text><rect x="50" y="180" width="230" height="105" rx="12" fill="#eaf6ee" stroke="#33825d" stroke-width="1.6"/><text x="165.0" y="240.2" font-size="22" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="206">选定 writeToFile</text><rect x="395" y="180" width="270" height="105" rx="12" fill="#edf3ff" stroke="#426baa" stroke-width="1.6"/><text x="530.0" y="224.7" font-size="22" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="246">createSave(write)</text><text x="530.0" y="255.7" font-size="22" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="246">返回保存函数</text><rect x="770" y="180" width="180" height="105" rx="12" fill="#f5f7fa" stroke="#7c8798" stroke-width="1.6"/><text x="860.0" y="240.2" font-size="22" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="156">保留 save</text><path class="edge" d="M280 232 L395 232" stroke="#65758d" marker-end="url(#arrowink)"/><rect x="313.0" y="197" width="50" height="27" rx="4" fill="#fff" stroke="none" stroke-width="1.6"/><text x="338" y="214" font-size="18" text-anchor="middle" style="fill:#65758d;font-weight:400">传入</text><path class="edge" d="M665 232 L770 232" stroke="#65758d" marker-end="url(#arrowink)"/><rect x="693.0" y="197" width="50" height="27" rx="4" fill="#fff" stroke="none" stroke-width="1.6"/><text x="718" y="214" font-size="18" text-anchor="middle" style="fill:#65758d;font-weight:400">返回</text><path class="edge" d="M860 285 L860 335 L530 335 L530 425" stroke="#65758d" marker-end="url(#arrowink)" stroke-dasharray="7 5"/><rect x="610.0" y="318" width="158" height="27" rx="4" fill="#fff" stroke="none" stroke-width="1.6"/><text x="689" y="335" font-size="18" text-anchor="middle" style="fill:#65758d;font-weight:400">稍后调用这个函数</text><text x="50" y="386" font-size="23" text-anchor="start" style="fill:#20304a;font-weight:600">点击保存时</text><rect x="50" y="425" width="230" height="115" rx="12" fill="#f5f7fa" stroke="#7c8798" stroke-width="1.6"/><text x="165.0" y="474.7" font-size="22" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="206">页面</text><text x="165.0" y="505.7" font-size="22" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="206">save(document)</text><rect x="395" y="425" width="270" height="115" rx="12" fill="#edf3ff" stroke="#426baa" stroke-width="1.6"/><text x="530.0" y="474.7" font-size="22" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="246">保存函数</text><text x="530.0" y="505.7" font-size="22" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="246">await write(document)</text><rect x="770" y="425" width="180" height="115" rx="12" fill="#eaf6ee" stroke="#33825d" stroke-width="1.6"/><text x="860.0" y="474.7" font-size="22" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="156">writeToFile</text><text x="860.0" y="505.7" font-size="22" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="156">写入文件</text><path class="edge" d="M280 482 L395 482" stroke="#65758d" marker-end="url(#arrowink)"/><rect x="304.0" y="446" width="68" height="27" rx="4" fill="#fff" stroke="none" stroke-width="1.6"/><text x="338" y="463" font-size="18" text-anchor="middle" style="fill:#65758d;font-weight:400">传文档</text><path class="edge" d="M665 482 L770 482" stroke="#65758d" marker-end="url(#arrowink)"/><rect x="693.0" y="446" width="50" height="27" rx="4" fill="#fff" stroke="none" stroke-width="1.6"/><text x="718" y="463" font-size="18" text-anchor="middle" style="fill:#65758d;font-weight:400">调用</text><text x="40" y="597" font-size="19" text-anchor="start" style="fill:#5d6a7e;font-weight:400" data-max-width="920">createSave 只保留实现引用；创建函数时还没有写入任何文档。</text></svg>