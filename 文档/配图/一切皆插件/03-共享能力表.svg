</style><rect x="0" y="0" width="1000" height="620" rx="16" fill="#fff" stroke="#dde3ec" stroke-width="1.6"/><text x="40" y="56" font-size="29" text-anchor="start" style="fill:#20304a;font-weight:600">需要自行连接时，先增加一张共享能力表</text><text x="40" y="92" font-size="19" text-anchor="start" style="fill:#5d6a7e;font-weight:400">表只保存实现引用；真正调用查询结果时才执行写入。</text><rect x="45" y="175" width="245" height="130" rx="12" fill="#eaf6ee" stroke="#33825d" stroke-width="1.6"/><text x="167.5" y="232.2" font-size="22" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="221">提供者</text><text x="167.5" y="263.2" font-size="22" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="221">登记写入函数</text><rect x="395" y="175" width="270" height="130" rx="12" fill="#fff5df" stroke="#ac7825" stroke-width="1.6"/><text x="530.0" y="216.35" font-size="21" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="246">共享能力表</text><text x="530.0" y="247.35" font-size="21" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="246">document/write</text><text x="530.0" y="278.35" font-size="21" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="246">→ writeToFile</text><rect x="770" y="175" width="185" height="130" rx="12" fill="#edf3ff" stroke="#426baa" stroke-width="1.6"/><text x="862.5" y="231.85" font-size="21" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="161">使用者</text><text x="862.5" y="262.85" font-size="21" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="161">按标识查询</text><path class="edge" d="M290 215 L395 215" stroke="#65758d" marker-end="url(#arrowink)"/><rect x="306.48" y="180" width="73.03999999999999" height="27" rx="4" fill="#fff" stroke="none" stroke-width="1.6"/><text x="343" y="197" font-size="18" text-anchor="middle" style="fill:#65758d;font-weight:400">① set</text><path class="edge" d="M770 215 L665 215" stroke="#65758d" marker-end="url(#arrowink)"/><rect x="681.48" y="180" width="73.03999999999999" height="27" rx="4" fill="#fff" stroke="none" stroke-width="1.6"/><text x="718" y="197" font-size="18" text-anchor="middle" style="fill:#65758d;font-weight:400">② get</text><path class="edge" d="M665 273 L770 273" stroke="#65758d" marker-end="url(#arrowink)"/><rect x="663.655" y="241" width="108.69" height="26" rx="4" fill="#fff" stroke="none" stroke-width="1.6"/><text x="718" y="257" font-size="17" text-anchor="middle" style="fill:#65758d;font-weight:400">③ 返回引用</text><path class="edge" d="M862 305 L862 400 L500 400 L500 445" stroke="#65758d" marker-end="url(#arrowink)"/><rect x="574.66" y="383" width="216.68" height="27" rx="4" fill="#fff" stroke="none" stroke-width="1.6"/><text x="683" y="400" font-size="18" text-anchor="middle" style="fill:#65758d;font-weight:400">④ createSave(write)</text><rect x="330" y="445" width="340" height="100" rx="12" fill="#edf3ff" stroke="#426baa" stroke-width="1.6"/><text x="500.0" y="487.2" font-size="22" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="316">保存函数</text><text x="500.0" y="518.2" font-size="22" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="316">调用得到的 write 实现</text><rect x="770" y="445" width="185" height="100" rx="12" fill="#eaf6ee" stroke="#33825d" stroke-width="1.6"/><text x="862.5" y="502.35" font-size="21" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="161">writeToFile</text><path class="edge" d="M670 495 L770 495" stroke="#65758d" marker-end="url(#arrowink)"/><rect x="679.0" y="462" width="82" height="26" rx="4" fill="#fff" stroke="none" stroke-width="1.6"/><text x="720" y="478" font-size="17" text-anchor="middle" style="fill:#65758d;font-weight:400">稍后调用</text><text x="40" y="592" font-size="19" text-anchor="start" style="fill:#5d6a7e;font-weight:400" data-max-width="920">登记让能力可被找到；查询返回引用，具体保存步骤仍由保存函数编写。</text></svg>