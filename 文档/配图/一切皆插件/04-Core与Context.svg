<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="795" viewBox="0 0 1000 795" role="img" aria-labelledby="title desc">
<title id="title">Core 管插件；C 管能力；context 记录归属</title><desc id="desc">应用创建一个 Core。各插件的 context 都连接它持有的同一张 C。</desc>
<defs><marker id="arrowink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#65758d"/></marker><marker id="arrowblue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#426baa"/></marker><marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#33825d"/></marker><marker id="arrowamber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#ac7825"/></marker><marker id="arrowpurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#7954a7"/></marker><marker id="arrowred" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#b64b58"/></marker><marker id="arrowgray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#7c8798"/></marker></defs><style>
text {font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill:#20304a;}
.heading {font-weight:600;} .edge {fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round;}
</style><rect x="0" y="0" width="1000" height="795" rx="16" fill="#fff" stroke="#dde3ec" stroke-width="1.6"/><text x="40" y="56" font-size="29" text-anchor="start" style="fill:#20304a;font-weight:600">Core 管插件；C 管能力；context 记录归属</text><text x="40" y="92" font-size="19" text-anchor="start" style="fill:#5d6a7e;font-weight:400">应用创建一个 Core。各插件的 context 都连接它持有的同一张 C。</text><rect x="360" y="135" width="280" height="75" rx="12" fill="#f5f7fa" stroke="#7c8798" stroke-width="1.6"/><text x="500.0" y="180.2" font-size="22" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="256">应用：new EngineCore()</text><rect x="360" y="260" width="595" height="315" rx="12" fill="#edf3ff" stroke="#426baa" stroke-width="1.6"/><text x="382" y="297" font-size="23" text-anchor="start" style="fill:#20304a;font-weight:600">EngineCore（唯一一个）</text><rect x="395" y="330" width="245" height="190" rx="12" fill="#edf3ff" stroke="#426baa" stroke-width="1.6"/><text x="517.5" y="404.0" font-size="20" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="221">已挂载插件记录</text><text x="517.5" y="432.0" font-size="20" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="221">ID → 原插件对象</text><text x="517.5" y="460.0" font-size="20" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="221">用于调用 deactivate</text><rect x="680" y="330" width="245" height="190" rx="12" fill="#fff5df" stroke="#ac7825" stroke-width="1.6"/><text x="802.5" y="404.0" font-size="20" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="221">能力注册表 C</text><text x="802.5" y="432.0" font-size="20" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="221">key → 实现 + ownerId</text><text x="802.5" y="460.0" font-size="20" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="221">用于查询和归属清理</text><path class="edge" d="M500 210 L500 260" stroke="#65758d" marker-end="url(#arrowink)"/><rect x="526.0" y="225" width="50" height="27" rx="4" fill="#fff" stroke="none" stroke-width="1.6"/><text x="551" y="242" font-size="18" text-anchor="middle" style="fill:#65758d;font-weight:400">创建</text><rect x="45" y="330" width="250" height="190" rx="12" fill="#eaf6ee" stroke="#33825d" stroke-width="1.6"/><text x="170.0" y="390.0" font-size="20" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="226">存储插件 P</text><text x="170.0" y="418.0" font-size="20" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="226">id: file-storage</text><text x="170.0" y="446.0" font-size="20" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="226">activate(context)</text><text x="170.0" y="474.0" font-size="20" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="226">可选 deactivate()</text><path class="edge" d="M360 360 L295 360" stroke="#65758d" marker-end="url(#arrowink)"/><rect x="266.895" y="321" width="118.21" height="26" rx="4" fill="#fff" stroke="none" stroke-width="1.6"/><text x="326" y="337" font-size="17" text-anchor="middle" style="fill:#65758d;font-weight:400">① activate</text><path class="edge" d="M295 445 L332 445 L332 540 L803 540 L803 520" stroke="#65758d" marker-end="url(#arrowink)"/><rect x="387.7" y="523" width="368.6" height="27" rx="4" fill="#fff" stroke="none" stroke-width="1.6"/><text x="572" y="540" font-size="18" text-anchor="middle" style="fill:#65758d;font-weight:400">② provide：先暂存，激活成功后登记到 C</text><rect x="45" y="645" width="280" height="90" rx="12" fill="#edf3ff" stroke="#426baa" stroke-width="1.6"/><text x="185.0" y="683.0" font-size="20" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="256">保存插件的 context</text><text x="185.0" y="711.0" font-size="20" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="256">查询同一张 C</text><path class="edge" d="M325 690 L895 690 L895 520" stroke="#65758d" marker-end="url(#arrowink)"/><rect x="423.88" y="673" width="278.24" height="27" rx="4" fill="#fff" stroke="none" stroke-width="1.6"/><text x="563" y="690" font-size="18" text-anchor="middle" style="fill:#65758d;font-weight:400">③ context.get(storageKey)</text><text x="425" y="616" font-size="20" text-anchor="start" style="fill:#5d6a7e;font-weight:400">provide 自动带上 ownerId = file-storage</text><text x="40" y="767" font-size="19" text-anchor="start" style="fill:#5d6a7e;font-weight:400" data-max-width="920">Core 保存插件对象以便停用；C 保存插件交出的函数或对象以便业务调用。</text></svg>