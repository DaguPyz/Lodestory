<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="695" viewBox="0 0 1000 695" role="img" aria-labelledby="title desc">
<title id="title">先根据能力声明找关系，再得到启动顺序</title><desc id="desc">依赖箭头表示“使用者需要提供者”；启动箭头表示“先后执行”。</desc>
<defs><marker id="arrowink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#65758d"/></marker><marker id="arrowblue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#426baa"/></marker><marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#33825d"/></marker><marker id="arrowamber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#ac7825"/></marker><marker id="arrowpurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#7954a7"/></marker><marker id="arrowred" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#b64b58"/></marker><marker id="arrowgray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#7c8798"/></marker></defs><style>
text {font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill:#20304a;}
.heading {font-weight:600;} .edge {fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round;}
</style><rect x="0" y="0" width="1000" height="695" rx="16" fill="#fff" stroke="#dde3ec" stroke-width="1.6"/><text x="40" y="56" font-size="29" text-anchor="start" style="fill:#20304a;font-weight:600">先根据能力声明找关系，再得到启动顺序</text><text x="40" y="92" font-size="19" text-anchor="start" style="fill:#5d6a7e;font-weight:400">依赖箭头表示“使用者需要提供者”；启动箭头表示“先后执行”。</text><text x="50" y="151" font-size="22" text-anchor="start" style="fill:#20304a;font-weight:600">输入顺序： [savePlugin, storagePlugin]</text><rect x="50" y="195" width="350" height="125" rx="12" fill="#edf3ff" stroke="#426baa" stroke-width="1.6"/><text x="225.0" y="233.85" font-size="21" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="326">保存插件 document-save</text><text x="225.0" y="264.85" font-size="21" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="326">requires: [storageKey]</text><text x="225.0" y="295.85" font-size="21" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="326">provides: [saveKey]</text><rect x="650" y="195" width="300" height="125" rx="12" fill="#eaf6ee" stroke="#33825d" stroke-width="1.6"/><text x="800.0" y="233.85" font-size="21" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="276">存储插件 file-storage</text><text x="800.0" y="264.85" font-size="21" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="276">requires: []</text><text x="800.0" y="295.85" font-size="21" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="276">provides: [storageKey]</text><path class="edge" d="M400 257 L650 257" stroke="#65758d" marker-end="url(#arrowink)"/><rect x="443.57" y="217" width="162.85999999999999" height="27" rx="4" fill="#fff" stroke="none" stroke-width="1.6"/><text x="525" y="234" font-size="18" text-anchor="middle" style="fill:#65758d;font-weight:400">需要 storageKey</text><text x="440" y="300" font-size="18" text-anchor="start" style="fill:#5d6a7e;font-weight:400">依赖关系</text><line x1="40" y1="360" x2="960" y2="360" stroke="#dce3ed" stroke-width="1.5"/><text x="50" y="402" font-size="22" text-anchor="start" style="fill:#20304a;font-weight:600">Core 先检查和排序，此时还没有调用 activate</text><rect x="50" y="465" width="300" height="105" rx="12" fill="#eaf6ee" stroke="#33825d" stroke-width="1.6"/><text x="200.0" y="510.5" font-size="20" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="276">① 先选存储</text><text x="200.0" y="538.5" font-size="20" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="276">不需要等待本批次其他插件</text><rect x="650" y="465" width="300" height="105" rx="12" fill="#edf3ff" stroke="#426baa" stroke-width="1.6"/><text x="800.0" y="510.5" font-size="20" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="276">② 再选保存</text><text x="800.0" y="538.5" font-size="20" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="276">依赖的存储已排在前面</text><path class="edge" d="M350 517 L650 517" stroke="#65758d" marker-end="url(#arrowink)"/><rect x="439.0" y="482" width="122" height="27" rx="4" fill="#fff" stroke="none" stroke-width="1.6"/><text x="500" y="499" font-size="18" text-anchor="middle" style="fill:#65758d;font-weight:400">得到启动顺序</text><text x="500" y="618" font-size="22" text-anchor="middle" style="fill:#20304a;font-weight:600">实际激活：await 存储成功 → await 保存成功</text><text x="40" y="667" font-size="19" text-anchor="start" style="fill:#5d6a7e;font-weight:400" data-max-width="920">缺失、冲突或循环在预检阶段报错；多个可选项按原输入顺序选择。</text></svg>