<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="625" viewBox="0 0 1000 625" role="img" aria-labelledby="title desc">
<title id="title">循环意味着找不到任何一个合法起点</title><desc id="desc">箭头均表示“依赖”；红色 A、B 构成环，X 只是被这个环阻塞。</desc>
<defs><marker id="arrowink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#65758d"/></marker><marker id="arrowblue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#426baa"/></marker><marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#33825d"/></marker><marker id="arrowamber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#ac7825"/></marker><marker id="arrowpurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#7954a7"/></marker><marker id="arrowred" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#b64b58"/></marker><marker id="arrowgray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#7c8798"/></marker></defs><style>
text {font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill:#20304a;}
.heading {font-weight:600;} .edge {fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round;}
</style><rect x="0" y="0" width="1000" height="625" rx="16" fill="#fff" stroke="#dde3ec" stroke-width="1.6"/><text x="40" y="56" font-size="29" text-anchor="start" style="fill:#20304a;font-weight:600">循环意味着找不到任何一个合法起点</text><text x="40" y="92" font-size="19" text-anchor="start" style="fill:#5d6a7e;font-weight:400">箭头均表示“依赖”；红色 A、B 构成环，X 只是被这个环阻塞。</text><rect x="50" y="245" width="220" height="115" rx="12" fill="#f5f7fa" stroke="#7c8798" stroke-width="1.6"/><text x="160.0" y="294.7" font-size="22" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="196">下游插件 X</text><text x="160.0" y="325.7" font-size="22" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="196">只依赖 A</text><rect x="395" y="245" width="230" height="115" rx="12" fill="#fff0f1" stroke="#b64b58" stroke-width="1.6"/><text x="510.0" y="295.5" font-size="20" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="206">插件 A</text><text x="510.0" y="323.5" font-size="20" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="206">需要 B 的写入能力</text><rect x="755" y="245" width="195" height="115" rx="12" fill="#fff0f1" stroke="#b64b58" stroke-width="1.6"/><text x="852.5" y="295.5" font-size="20" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="171">插件 B</text><text x="852.5" y="323.5" font-size="20" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="171">需要 A 的保存能力</text><path class="edge" d="M270 300 L395 300" stroke="#65758d" marker-end="url(#arrowink)"/><rect x="298.74" y="265" width="70.52" height="27" rx="4" fill="#fff" stroke="none" stroke-width="1.6"/><text x="334" y="282" font-size="18" text-anchor="middle" style="fill:#65758d;font-weight:400">依赖 A</text><path class="edge" d="M625 275 L755 275" stroke="#b64b58" marker-end="url(#arrowred)"/><rect x="615.17" y="235" width="149.66" height="26" rx="4" fill="#fff" stroke="none" stroke-width="1.6"/><text x="690" y="251" font-size="17" text-anchor="middle" style="fill:#b64b58;font-weight:400">document/write</text><path class="edge" d="M852 360 L852 430 L510 430 L510 360" stroke="#b64b58" marker-end="url(#arrowred)"/><rect x="603.605" y="412" width="154.78999999999996" height="28" rx="4" fill="#fff" stroke="none" stroke-width="1.6"/><text x="681" y="430" font-size="19" text-anchor="middle" style="fill:#b64b58;font-weight:400">document/save</text><text x="510" y="191" font-size="22" text-anchor="middle" style="fill:#b64b58;font-weight:600">A 等 B</text><text x="852" y="191" font-size="22" text-anchor="middle" style="fill:#b64b58;font-weight:600">B 等 A</text><rect x="185" y="488" width="630" height="70" rx="12" fill="#fff0f1" stroke="#b64b58" stroke-width="1.6"/><text x="500.0" y="530.35" font-size="21" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="606">Core 拒绝整批挂载，报告循环链 A → B → A</text><text x="40" y="597" font-size="19" text-anchor="start" style="fill:#5d6a7e;font-weight:400" data-max-width="920">不能把 X 报成循环成员；拒绝发生在任何 activate 或 deactivate 执行之前。</text></svg>