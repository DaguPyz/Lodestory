<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="770" viewBox="0 0 1000 770" role="img" aria-labelledby="title desc">
<title id="title">声明有人提供，还要等它真正准备完成</title><desc id="desc">以下是一个插件的激活过程；提交范围是单个插件，整批依次执行。</desc>
<defs><marker id="arrowink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#65758d"/></marker><marker id="arrowblue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#426baa"/></marker><marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#33825d"/></marker><marker id="arrowamber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#ac7825"/></marker><marker id="arrowpurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#7954a7"/></marker><marker id="arrowred" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#b64b58"/></marker><marker id="arrowgray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#7c8798"/></marker></defs><style>
text {font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill:#20304a;}
.heading {font-weight:600;} .edge {fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round;}
</style><rect x="0" y="0" width="1000" height="770" rx="16" fill="#fff" stroke="#dde3ec" stroke-width="1.6"/><text x="40" y="56" font-size="29" text-anchor="start" style="fill:#20304a;font-weight:600">声明有人提供，还要等它真正准备完成</text><text x="40" y="92" font-size="19" text-anchor="start" style="fill:#5d6a7e;font-weight:400">以下是一个插件的激活过程；提交范围是单个插件，整批依次执行。</text><rect x="45" y="160" width="250" height="105" rx="12" fill="#edf3ff" stroke="#426baa" stroke-width="1.6"/><text x="170.0" y="205.5" font-size="20" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="226">① 确认依赖可用</text><text x="170.0" y="233.5" font-size="20" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="226">记录实际提供者</text><rect x="375" y="160" width="250" height="105" rx="12" fill="#edf3ff" stroke="#426baa" stroke-width="1.6"/><text x="500.0" y="205.5" font-size="20" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="226">② await activate(ctx)</text><text x="500.0" y="233.5" font-size="20" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="226">provide 先写入暂存区</text><rect x="705" y="160" width="250" height="105" rx="12" fill="#edf3ff" stroke="#426baa" stroke-width="1.6"/><text x="830.0" y="205.5" font-size="20" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="226">③ 检查 provides</text><text x="830.0" y="233.5" font-size="20" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="226">是否齐全、提交是否冲突</text><path class="edge" d="M295 212 L375 212" stroke="#65758d" marker-end="url(#arrowink)"/><path class="edge" d="M625 212 L705 212" stroke="#65758d" marker-end="url(#arrowink)"/><rect x="375" y="345" width="250" height="130" rx="12" fill="#f5f7fa" stroke="#7c8798" stroke-width="1.6"/><text x="500.0" y="389.0" font-size="20" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="226">本插件暂存区</text><text x="500.0" y="417.0" font-size="20" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="226">自己可以读取</text><text x="500.0" y="445.0" font-size="20" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="226">其他插件不可见</text><path class="edge" d="M500 265 L500 345" stroke="#65758d" marker-end="url(#arrowink)"/><rect x="510.09000000000003" y="293" width="85.82" height="27" rx="4" fill="#fff" stroke="none" stroke-width="1.6"/><text x="553" y="310" font-size="18" text-anchor="middle" style="fill:#65758d;font-weight:400">provide</text><path class="edge" d="M830 265 L830 345" stroke="#65758d" marker-end="url(#arrowink)"/><rect x="846.0" y="293" width="86" height="27" rx="4" fill="#fff" stroke="none" stroke-width="1.6"/><text x="889" y="310" font-size="18" text-anchor="middle" style="fill:#65758d;font-weight:400">全部通过</text><rect x="705" y="345" width="250" height="130" rx="12" fill="#fff5df" stroke="#ac7825" stroke-width="1.6"/><text x="830.0" y="403.0" font-size="20" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="226">④ 一次提交到 C</text><text x="830.0" y="431.0" font-size="20" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="226">全部能力对外可见</text><path class="edge" d="M625 410 L705 410" stroke="#65758d" marker-end="url(#arrowink)"/><rect x="641.0" y="379" width="48" height="26" rx="4" fill="#fff" stroke="none" stroke-width="1.6"/><text x="665" y="395" font-size="17" text-anchor="middle" style="fill:#65758d;font-weight:400">提交</text><rect x="705" y="580" width="250" height="105" rx="12" fill="#edf3ff" stroke="#426baa" stroke-width="1.6"/><text x="830.0" y="625.5" font-size="20" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="226">⑤ 记录挂载成功</text><text x="830.0" y="653.5" font-size="20" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="226">再激活下一插件</text><path class="edge" d="M830 475 L830 580" stroke="#65758d" marker-end="url(#arrowink)"/><rect x="851.0" y="522" width="50" height="27" rx="4" fill="#fff" stroke="none" stroke-width="1.6"/><text x="876" y="539" font-size="18" text-anchor="middle" style="fill:#65758d;font-weight:400">完成</text><rect x="45" y="565" width="480" height="120" rx="12" fill="#fff0f1" stroke="#b64b58" stroke-width="1.6"/><text x="285.0" y="604.0" font-size="20" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="456">激活失败、漏登记或冲突</text><text x="285.0" y="632.0" font-size="20" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="456">调用 deactivate 清理已初始化部分</text><text x="285.0" y="660.0" font-size="20" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="456">丢弃暂存；撤销 context 和依赖</text><path class="edge" d="M830 265 L975 265 L975 525 L285 525 L285 565" stroke="#b64b58" marker-end="url(#arrowred)"/><rect x="555.74" y="508" width="178.52" height="27" rx="4" fill="#fff" stroke="none" stroke-width="1.6"/><text x="645" y="525" font-size="18" text-anchor="middle" style="fill:#b64b58;font-weight:400">任一步失败 → 清理</text><text x="40" y="742" font-size="19" text-anchor="start" style="fill:#5d6a7e;font-weight:400" data-max-width="920">直接 provide 不等于公开成功；必须等 activate 完成并通过完整性检查。</text></svg>