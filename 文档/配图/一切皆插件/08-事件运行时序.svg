<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="1090" viewBox="0 0 1060 1090" role="img" aria-labelledby="title desc">
<title id="title">订阅先建立；业务成功时才发布</title><desc id="desc">从上往下读时间。实线是调用，虚线是返回；消息由业务主动发布。</desc>
