</style><rect x="0" y="0" width="1060" height="1090" rx="16" fill="#fff" stroke="#dde3ec" stroke-width="1.6"/><text x="40" y="56" font-size="29" text-anchor="start" style="fill:#20304a;font-weight:600">订阅先建立；业务成功时才发布</text><text x="40" y="92" font-size="19" text-anchor="start" style="fill:#5d6a7e;font-weight:400">从上往下读时间。实线是调用，虚线是返回；消息由业务主动发布。</text><rect x="795" y="27" width="225" height="38" rx="19" fill="#f3efff" stroke="#7954a7" stroke-width="1.6" stroke-dasharray="7 5"/><text x="907.5" y="52" font-size="18" text-anchor="middle" style="fill:#7954a7;font-weight:400">事件方案 · 尚未实现</text><rect x="55" y="145" width="170" height="80" rx="12" fill="#f3efff" stroke="#7954a7" stroke-width="1.6" stroke-dasharray="7 5"/><text x="140.0" y="177.65" font-size="19" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="146">日志插件 P</text><text x="140.0" y="205.65" font-size="19" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="146">save-log</text><line x1="140" y1="225" x2="140" y2="1010" stroke="#c9d3e0" stroke-width="1.5" stroke-dasharray="5 6"/><rect x="255" y="145" width="170" height="80" rx="12" fill="#edf3ff" stroke="#426baa" stroke-width="1.6"/><text x="340.0" y="177.65" font-size="19" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="146">保存函数</text><text x="340.0" y="205.65" font-size="19" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="146">save(document)</text><line x1="340" y1="225" x2="340" y2="1010" stroke="#c9d3e0" stroke-width="1.5" stroke-dasharray="5 6"/><rect x="435" y="145" width="170" height="80" rx="12" fill="#eaf6ee" stroke="#33825d" stroke-width="1.6"/><text x="520.0" y="177.65" font-size="19" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="146">写入函数</text><text x="520.0" y="205.65" font-size="19" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="146">write(document)</text><line x1="520" y1="225" x2="520" y2="1010" stroke="#c9d3e0" stroke-width="1.5" stroke-dasharray="5 6"/><rect x="635" y="145" width="170" height="80" rx="12" fill="#f3efff" stroke="#7954a7" stroke-width="1.6" stroke-dasharray="7 5"/><text x="720.0" y="177.65" font-size="19" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="146">EventBus</text><text x="720.0" y="205.65" font-size="19" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="146">Core 持有</text><line x1="720" y1="225" x2="720" y2="1010" stroke="#c9d3e0" stroke-width="1.5" stroke-dasharray="5 6"/><rect x="835" y="145" width="170" height="80" rx="12" fill="#f3efff" stroke="#7954a7" stroke-width="1.6" stroke-dasharray="7 5"/><text x="920.0" y="177.65" font-size="19" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="146">日志监听</text><text x="920.0" y="205.65" font-size="19" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="146">handler</text><line x1="920" y1="225" x2="920" y2="1010" stroke="#c9d3e0" stroke-width="1.5" stroke-dasharray="5 6"/><rect x="35" y="244" width="990" height="43" rx="8" fill="#f5f7fa" stroke="none" stroke-width="1.6"/><text x="50" y="273" font-size="21" text-anchor="start" style="fill:#20304a;font-weight:600">启动阶段：Core 调用日志插件的 activate(context)</text><path class="edge" d="M140 335 L720 335" stroke="#7954a7" marker-end="url(#arrowpurple)"/><rect x="213.50000000000003" y="299" width="432.99999999999994" height="29" rx="4" fill="#fff" stroke="none" stroke-width="1.6"/><text x="430" y="318" font-size="20" text-anchor="middle" style="fill:#7954a7;font-weight:400">① context.on(documentSaved, handler)</text><path class="edge" d="M720 387 L140 387" stroke="#7954a7" marker-end="url(#arrowpurple)" stroke-dasharray="7 5"/><rect x="247.3" y="351" width="365.4" height="29" rx="4" fill="#fff" stroke="none" stroke-width="1.6"/><text x="430" y="370" font-size="20" text-anchor="middle" style="fill:#7954a7;font-weight:400">② 返回取消函数；激活成功后订阅生效</text><rect x="35" y="420" width="990" height="43" rx="8" fill="#f5f7fa" stroke="none" stroke-width="1.6"/><text x="50" y="449" font-size="21" text-anchor="start" style="fill:#20304a;font-weight:600">运行阶段：用户点击保存，页面调用之前取得的保存函数</text><path class="edge" d="M45 511 L340 511" stroke="#65758d" marker-end="url(#arrowink)"/><rect x="95.275" y="476" width="195.45" height="28" rx="4" fill="#fff" stroke="none" stroke-width="1.6"/><text x="193" y="494" font-size="19" text-anchor="middle" style="fill:#65758d;font-weight:400">③ save(document)</text><path class="edge" d="M340 571 L520 571" stroke="#65758d" marker-end="url(#arrowink)"/><rect x="326.79" y="536" width="206.42" height="27" rx="4" fill="#fff" stroke="none" stroke-width="1.6"/><text x="430" y="553" font-size="18" text-anchor="middle" style="fill:#65758d;font-weight:400">④ await write(...)</text><path class="edge" d="M520 629 L340 629" stroke="#33825d" marker-end="url(#arrowgreen)" stroke-dasharray="7 5"/><rect x="370.085" y="594" width="119.83" height="28" rx="4" fill="#fff" stroke="none" stroke-width="1.6"/><text x="430" y="612" font-size="19" text-anchor="middle" style="fill:#33825d;font-weight:400">⑤ 写入成功</text><path class="edge" d="M340 691 L720 691" stroke="#7954a7" marker-end="url(#arrowpurple)"/><rect x="329.32" y="657" width="401.36" height="27" rx="4" fill="#fff" stroke="none" stroke-width="1.6"/><text x="530" y="674" font-size="18" text-anchor="middle" style="fill:#7954a7;font-weight:400">⑥ emit(documentSaved, { documentId })</text><path class="edge" d="M720 725 L761 725 L761 752 L720 752" stroke="#7954a7" marker-end="url(#arrowpurple)"/><text x="784" y="737" font-size="18" text-anchor="start" style="fill:#7954a7;font-weight:400">按同一个 key 查监听列表</text><path class="edge" d="M720 795 L920 795" stroke="#7954a7" marker-end="url(#arrowpurple)"/><rect x="722.135" y="762" width="195.73" height="26" rx="4" fill="#fff" stroke="none" stroke-width="1.6"/><text x="820" y="778" font-size="17" text-anchor="middle" style="fill:#7954a7;font-weight:400">⑦ handler(payload)</text><path class="edge" d="M920 853 L720 853" stroke="#7954a7" marker-end="url(#arrowpurple)" stroke-dasharray="7 5"/><rect x="760.085" y="818" width="119.83" height="28" rx="4" fill="#fff" stroke="none" stroke-width="1.6"/><text x="820" y="836" font-size="19" text-anchor="middle" style="fill:#7954a7;font-weight:400">⑧ 日志完成</text><path class="edge" d="M720 915 L340 915" stroke="#7954a7" marker-end="url(#arrowpurple)" stroke-dasharray="7 5"/><rect x="451.08500000000004" y="880" width="157.82999999999998" height="28" rx="4" fill="#fff" stroke="none" stroke-width="1.6"/><text x="530" y="898" font-size="19" text-anchor="middle" style="fill:#7954a7;font-weight:400">⑨ 本次通知完成</text><path class="edge" d="M340 980 L45 980" stroke="#65758d" marker-end="url(#arrowink)" stroke-dasharray="7 5"/><rect x="95.08500000000001" y="945" width="195.82999999999998" height="28" rx="4" fill="#fff" stroke="none" stroke-width="1.6"/><text x="193" y="963" font-size="19" text-anchor="middle" style="fill:#65758d;font-weight:400">⑩ 保存函数返回页面</text><text x="40" y="1062" font-size="19" text-anchor="start" style="fill:#5d6a7e;font-weight:400" data-max-width="980">写入失败不会执行第⑥步；多个监听按登记顺序逐个等待，失败汇总交给发布者。</text></svg>