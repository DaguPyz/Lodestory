<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="700" viewBox="0 0 1060 700" role="img" aria-labelledby="title desc">
<title id="title">新事件怎样被其他插件知道</title><desc id="desc">公开契约供开发者接入；运行时只调用已经显式订阅的监听。</desc>
<defs><marker id="arrowink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#65758d"/></marker><marker id="arrowblue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#426baa"/></marker><marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#33825d"/></marker><marker id="arrowamber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#ac7825"/></marker><marker id="arrowpurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#7954a7"/></marker><marker id="arrowred" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#b64b58"/></marker><marker id="arrowgray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#7c8798"/></marker></defs><style>
text {font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill:#20304a;}
.heading {font-weight:600;} .edge {fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round;}
</style><rect x="0" y="0" width="1060" height="700" rx="16" fill="#fff" stroke="#dde3ec" stroke-width="1.6"/><text x="40" y="56" font-size="29" text-anchor="start" style="fill:#20304a;font-weight:600">新事件怎样被其他插件知道</text><text x="40" y="92" font-size="19" text-anchor="start" style="fill:#5d6a7e;font-weight:400">公开契约供开发者接入；运行时只调用已经显式订阅的监听。</text><rect x="795" y="27" width="225" height="38" rx="19" fill="#f3efff" stroke="#7954a7" stroke-width="1.6" stroke-dasharray="7 5"/><text x="907.5" y="52" font-size="18" text-anchor="middle" style="fill:#7954a7;font-weight:400">事件方案 · 尚未实现</text><rect x="45" y="175" width="255" height="150" rx="12" fill="#edf3ff" stroke="#426baa" stroke-width="1.6"/><text x="172.5" y="229.0" font-size="20" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="231">发布插件的作者</text><text x="172.5" y="257.0" font-size="20" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="231">明确 E 的业务含义</text><text x="172.5" y="285.0" font-size="20" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="231">确定 emit 的准确位置</text><rect x="390" y="175" width="275" height="150" rx="12" fill="#f3efff" stroke="#7954a7" stroke-width="1.6" stroke-dasharray="7 5"/><text x="527.5" y="229.0" font-size="20" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="251">公开契约模块与文档</text><text x="527.5" y="257.0" font-size="20" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="251">导出共享 EventKey&lt;T&gt;</text><text x="527.5" y="285.0" font-size="20" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="251">说明 payload 和执行规则</text><rect x="755" y="175" width="260" height="150" rx="12" fill="#f3efff" stroke="#7954a7" stroke-width="1.6" stroke-dasharray="7 5"/><text x="885.0" y="229.0" font-size="20" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="236">其他插件的作者</text><text x="885.0" y="257.0" font-size="20" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="236">导入同一个 E</text><text x="885.0" y="285.0" font-size="20" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="236">编写 on(E, handler)</text><path class="edge" d="M300 250 L390 250" stroke="#65758d" marker-end="url(#arrowink)"/><rect x="320.0" y="213" width="50" height="27" rx="4" fill="#fff" stroke="none" stroke-width="1.6"/><text x="345" y="230" font-size="18" text-anchor="middle" style="fill:#65758d;font-weight:400">公开</text><path class="edge" d="M665 250 L755 250" stroke="#7954a7" marker-end="url(#arrowpurple)"/><rect x="669.0" y="214" width="82" height="26" rx="4" fill="#fff" stroke="none" stroke-width="1.6"/><text x="710" y="230" font-size="17" text-anchor="middle" style="fill:#7954a7;font-weight:400">查阅接入</text><rect x="390" y="440" width="275" height="120" rx="12" fill="#f3efff" stroke="#7954a7" stroke-width="1.6" stroke-dasharray="7 5"/><text x="527.5" y="491.85" font-size="21" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="251">运行时订阅表</text><text x="527.5" y="522.85" font-size="21" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="251">只记录 on 过的监听</text><path class="edge" d="M885 325 L885 500 L665 500" stroke="#7954a7" marker-end="url(#arrowpurple)"/><rect x="752.0" y="483" width="140" height="27" rx="4" fill="#fff" stroke="none" stroke-width="1.6"/><text x="822" y="500" font-size="18" text-anchor="middle" style="fill:#7954a7;font-weight:400">插件激活时登记</text><rect x="45" y="440" width="255" height="120" rx="12" fill="#edf3ff" stroke="#426baa" stroke-width="1.6"/><text x="172.5" y="493.0" font-size="20" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="231">业务执行到约定位置</text><text x="172.5" y="521.0" font-size="20" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="231">主动 emit(E, data)</text><path class="edge" d="M172 325 L172 440" stroke="#65758d" marker-end="url(#arrowink)"/><rect x="189.0" y="374" width="140" height="27" rx="4" fill="#fff" stroke="none" stroke-width="1.6"/><text x="259" y="391" font-size="18" text-anchor="middle" style="fill:#65758d;font-weight:400">开发完成后运行</text><path class="edge" d="M300 500 L390 500" stroke="#7954a7" marker-end="url(#arrowpurple)"/><rect x="320.0" y="464" width="50" height="27" rx="4" fill="#fff" stroke="none" stroke-width="1.6"/><text x="345" y="481" font-size="18" text-anchor="middle" style="fill:#7954a7;font-weight:400">查表</text><text x="715" y="603" font-size="20" text-anchor="start" style="fill:#5d6a7e;font-weight:400">没有订阅的已有插件不会收到 E</text><text x="40" y="672" font-size="19" text-anchor="start" style="fill:#5d6a7e;font-weight:400" data-max-width="980">新事件无需修改内核业务枚举；旧插件和未来插件都要依据契约显式接入。</text></svg>