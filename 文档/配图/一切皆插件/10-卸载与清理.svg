<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="820" viewBox="0 0 1000 820" role="img" aria-labelledby="title desc">
<title id="title">先确认没人依赖，再停用并撤销登记</title><desc id="desc">以卸载存储插件为例：保存尚未停用时，Core 会拒绝这次卸载。</desc>
<defs><marker id="arrowink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#65758d"/></marker><marker id="arrowblue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#426baa"/></marker><marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#33825d"/></marker><marker id="arrowamber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#ac7825"/></marker><marker id="arrowpurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#7954a7"/></marker><marker id="arrowred" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#b64b58"/></marker><marker id="arrowgray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#7c8798"/></marker></defs><style>
text {font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill:#20304a;}
.heading {font-weight:600;} .edge {fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round;}
</style><rect x="0" y="0" width="1000" height="820" rx="16" fill="#fff" stroke="#dde3ec" stroke-width="1.6"/><text x="40" y="56" font-size="29" text-anchor="start" style="fill:#20304a;font-weight:600">先确认没人依赖，再停用并撤销登记</text><text x="40" y="92" font-size="19" text-anchor="start" style="fill:#5d6a7e;font-weight:400">以卸载存储插件为例：保存尚未停用时，Core 会拒绝这次卸载。</text><rect x="50" y="155" width="285" height="95" rx="12" fill="#edf3ff" stroke="#426baa" stroke-width="1.6"/><text x="192.5" y="208.8" font-size="18" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="261">core.unmount(&quot;file-storage&quot;)</text><rect x="415" y="155" width="265" height="95" rx="12" fill="#edf3ff" stroke="#426baa" stroke-width="1.6"/><text x="547.5" y="195.5" font-size="20" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="241">检查依赖记录</text><text x="547.5" y="223.5" font-size="20" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="241">还有谁依赖存储？</text><path class="edge" d="M335 203 L415 203" stroke="#65758d" marker-end="url(#arrowink)"/><rect x="745" y="155" width="210" height="95" rx="12" fill="#fff0f1" stroke="#b64b58" stroke-width="1.6"/><text x="850.0" y="195.5" font-size="20" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="186">仍有保存插件</text><text x="850.0" y="223.5" font-size="20" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="186">拒绝卸载</text><path class="edge" d="M680 203 L745 203" stroke="#b64b58" marker-end="url(#arrowred)"/><rect x="697.0" y="168" width="32" height="27" rx="4" fill="#fff" stroke="none" stroke-width="1.6"/><text x="713" y="185" font-size="18" text-anchor="middle" style="fill:#b64b58;font-weight:400">有</text><rect x="415" y="365" width="300" height="120" rx="12" fill="#edf3ff" stroke="#426baa" stroke-width="1.6"/><text x="565.0" y="404.0" font-size="20" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="276">await deactivate()</text><text x="565.0" y="432.0" font-size="20" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="276">插件释放文件句柄、定时器</text><text x="565.0" y="460.0" font-size="20" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="276">若有此方法则调用</text><path class="edge" d="M548 250 L548 365" stroke="#65758d" marker-end="url(#arrowink)"/><rect x="582.0" y="293" width="104" height="27" rx="4" fill="#fff" stroke="none" stroke-width="1.6"/><text x="634" y="310" font-size="18" text-anchor="middle" style="fill:#65758d;font-weight:400">没有依赖者</text><rect x="90" y="585" width="430" height="140" rx="12" fill="#edf3ff" stroke="#426baa" stroke-width="1.6"/><text x="305.0" y="631.35" font-size="21" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="406">Core 清理自己的记录</text><text x="305.0" y="662.35" font-size="21" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="406">撤销能力、挂载记录和依赖</text><text x="305.0" y="693.35" font-size="21" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="406">让旧 context 失效</text><rect x="585" y="585" width="370" height="140" rx="12" fill="#f3efff" stroke="#7954a7" stroke-width="1.6" stroke-dasharray="7 5"/><text x="770.0" y="634.0" font-size="20" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="346">事件方案加入后</text><text x="770.0" y="662.0" font-size="20" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="346">一并撤销所属插件的订阅</text><text x="770.0" y="690.0" font-size="20" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="346">旧 context 不能再 on / emit</text><path class="edge" d="M565 485 L565 540 L305 540 L305 585" stroke="#65758d" marker-end="url(#arrowink)"/><rect x="340.0" y="521" width="234" height="29" rx="4" fill="#fff" stroke="none" stroke-width="1.6"/><text x="457" y="540" font-size="20" text-anchor="middle" style="fill:#65758d;font-weight:400">成功或抛错，均执行清理</text><path class="edge" d="M520 655 L585 655" stroke="#7954a7" marker-end="url(#arrowpurple)" stroke-dasharray="7 5"/><text x="40" y="792" font-size="19" text-anchor="start" style="fill:#5d6a7e;font-weight:400" data-max-width="920">清理不会销毁已取出的函数引用；已开始的异步回调也不会被强行中断。</text></svg>