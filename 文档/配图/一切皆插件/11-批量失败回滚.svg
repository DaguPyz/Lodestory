<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="735" viewBox="0 0 1000 735" role="img" aria-labelledby="title desc">
<title id="title">本批次失败后，先清失败者，再逆序撤销成功者</title><desc id="desc">A、B、D 只是示意插件。假设 B 依赖 A，D 依赖 B。</desc>
<defs><marker id="arrowink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#65758d"/></marker><marker id="arrowblue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#426baa"/></marker><marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#33825d"/></marker><marker id="arrowamber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#ac7825"/></marker><marker id="arrowpurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#7954a7"/></marker><marker id="arrowred" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#b64b58"/></marker><marker id="arrowgray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#7c8798"/></marker></defs><style>
text {font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill:#20304a;}
.heading {font-weight:600;} .edge {fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round;}
</style><rect x="0" y="0" width="1000" height="735" rx="16" fill="#fff" stroke="#dde3ec" stroke-width="1.6"/><text x="40" y="56" font-size="29" text-anchor="start" style="fill:#20304a;font-weight:600">本批次失败后，先清失败者，再逆序撤销成功者</text><text x="40" y="92" font-size="19" text-anchor="start" style="fill:#5d6a7e;font-weight:400">A、B、D 只是示意插件。假设 B 依赖 A，D 依赖 B。</text><rect x="45" y="150" width="210" height="470" rx="12" fill="#f5f7fa" stroke="#7c8798" stroke-width="1.6"/><text x="67" y="187" font-size="23" text-anchor="start" style="fill:#20304a;font-weight:600">批次开始前</text><rect x="70" y="255" width="160" height="170" rx="12" fill="#f5f7fa" stroke="#7c8798" stroke-width="1.6"/><text x="150.0" y="319.0" font-size="20" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="136">已有插件</text><text x="150.0" y="347.0" font-size="20" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="136">原记录保留</text><text x="150.0" y="375.0" font-size="20" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="136">不参与回滚</text><rect x="295" y="150" width="660" height="210" rx="12" fill="#edf3ff" stroke="#426baa" stroke-width="1.6"/><text x="317" y="187" font-size="23" text-anchor="start" style="fill:#20304a;font-weight:600">本批次：按排序逐个激活</text><rect x="325" y="225" width="150" height="95" rx="12" fill="#eaf6ee" stroke="#33825d" stroke-width="1.6"/><text x="400.0" y="264.35" font-size="21" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="126">A</text><text x="400.0" y="295.35" font-size="21" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="126">激活成功</text><rect x="550" y="225" width="150" height="95" rx="12" fill="#eaf6ee" stroke="#33825d" stroke-width="1.6"/><text x="625.0" y="264.35" font-size="21" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="126">B</text><text x="625.0" y="295.35" font-size="21" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="126">激活成功</text><rect x="775" y="225" width="150" height="95" rx="12" fill="#fff0f1" stroke="#b64b58" stroke-width="1.6"/><text x="850.0" y="264.35" font-size="21" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="126">D</text><text x="850.0" y="295.35" font-size="21" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="126">激活失败</text><path class="edge" d="M475 272 L550 272" stroke="#65758d" marker-end="url(#arrowink)"/><path class="edge" d="M700 272 L775 272" stroke="#65758d" marker-end="url(#arrowink)"/><rect x="295" y="405" width="660" height="215" rx="12" fill="#f5f7fa" stroke="#7c8798" stroke-width="1.6"/><text x="317" y="442" font-size="23" text-anchor="start" style="fill:#20304a;font-weight:600">清理顺序：失败者优先，成功者逆序</text><rect x="325" y="490" width="150" height="95" rx="12" fill="#edf3ff" stroke="#426baa" stroke-width="1.6"/><text x="400.0" y="529.8" font-size="18" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="126">③ 卸载 A</text><text x="400.0" y="557.8" font-size="18" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="126">最后撤销提供者</text><rect x="550" y="490" width="150" height="95" rx="12" fill="#edf3ff" stroke="#426baa" stroke-width="1.6"/><text x="625.0" y="529.8" font-size="18" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="126">② 卸载 B</text><text x="625.0" y="557.8" font-size="18" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="126">先撤销使用者</text><rect x="775" y="490" width="150" height="95" rx="12" fill="#fff0f1" stroke="#b64b58" stroke-width="1.6"/><text x="850.0" y="529.8" font-size="18" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="126">① 清理 D</text><text x="850.0" y="557.8" font-size="18" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="126">处理部分初始化</text><path class="edge" d="M850 320 L850 490" stroke="#b64b58" marker-end="url(#arrowred)"/><rect x="860.81" y="376" width="84.38" height="26" rx="4" fill="#fff" stroke="none" stroke-width="1.6"/><text x="903" y="392" font-size="17" text-anchor="middle" style="fill:#b64b58;font-weight:400">先处理 D</text><path class="edge" d="M775 537 L700 537" stroke="#65758d" marker-end="url(#arrowink)"/><path class="edge" d="M550 537 L475 537" stroke="#65758d" marker-end="url(#arrowink)"/><text x="320" y="667" font-size="20" text-anchor="start" style="fill:#5d6a7e;font-weight:400">某次清理失败也继续其余清理，并保留原错误与清理错误。</text><text x="40" y="707" font-size="19" text-anchor="start" style="fill:#5d6a7e;font-weight:400" data-max-width="920">回滚撤销本批次的生命周期和登记；已经发生的外部业务效果不会自动撤回。</text></svg>