<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1080" viewBox="0 0 1100 1080" role="img" aria-labelledby="title desc">
<title id="title">把前面推导出的结构放回一张图</title><desc id="desc">上半部分是装配和管理关系；下半部分是业务函数的调用关系。</desc>
<defs><marker id="arrowink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#65758d"/></marker><marker id="arrowblue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#426baa"/></marker><marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#33825d"/></marker><marker id="arrowamber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#ac7825"/></marker><marker id="arrowpurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#7954a7"/></marker><marker id="arrowred" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#b64b58"/></marker><marker id="arrowgray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#7c8798"/></marker></defs><style>
text {font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill:#20304a;}
.heading {font-weight:600;} .edge {fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round;}
</style><rect x="0" y="0" width="1100" height="1080" rx="16" fill="#fff" stroke="#dde3ec" stroke-width="1.6"/><text x="40" y="56" font-size="29" text-anchor="start" style="fill:#20304a;font-weight:600">把前面推导出的结构放回一张图</text><text x="40" y="92" font-size="19" text-anchor="start" style="fill:#5d6a7e;font-weight:400">上半部分是装配和管理关系；下半部分是业务函数的调用关系。</text><rect x="45" y="150" width="270" height="95" rx="12" fill="#f5f7fa" stroke="#7c8798" stroke-width="1.6"/><text x="180.0" y="189.7" font-size="22" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="246">应用启动入口</text><text x="180.0" y="220.7" font-size="22" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="246">new EngineCore()</text><rect x="410" y="140" width="645" height="575" rx="12" fill="#edf3ff" stroke="#426baa" stroke-width="1.6"/><text x="432" y="177" font-size="23" text-anchor="start" style="fill:#20304a;font-weight:600">一个 EngineCore</text><path class="edge" d="M315 198 L410 198" stroke="#65758d" marker-end="url(#arrowink)"/><rect x="338.0" y="161" width="50" height="27" rx="4" fill="#fff" stroke="none" stroke-width="1.6"/><text x="363" y="178" font-size="18" text-anchor="middle" style="fill:#65758d;font-weight:400">创建</text><rect x="45" y="325" width="270" height="245" rx="12" fill="#eaf6ee" stroke="#33825d" stroke-width="1.6"/><text x="180.0" y="398.5" font-size="20" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="246">插件 P</text><text x="180.0" y="426.5" font-size="20" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="246">id + requires / provides</text><text x="180.0" y="454.5" font-size="20" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="246">activate(context)</text><text x="180.0" y="482.5" font-size="20" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="246">deactivate()</text><text x="180.0" y="510.5" font-size="20" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="246">业务实现由插件编写</text><rect x="670" y="235" width="350" height="130" rx="12" fill="#fff5df" stroke="#ac7825" stroke-width="1.6"/><text x="845.0" y="279.0" font-size="20" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="326">能力注册表 C</text><text x="845.0" y="307.0" font-size="20" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="326">key → 实现 + ownerId</text><text x="845.0" y="335.0" font-size="20" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="326">登记、查询、检查和按归属清理</text><rect x="670" y="420" width="350" height="145" rx="12" fill="#f3efff" stroke="#7954a7" stroke-width="1.6" stroke-dasharray="7 5"/><text x="845.0" y="471.5" font-size="20" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="326">EventBus（拟新增）</text><text x="845.0" y="499.5" font-size="20" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="326">事件 key → 监听列表 + 归属</text><text x="845.0" y="527.5" font-size="20" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="326">登记监听、查表分发、取消订阅</text><rect x="450" y="600" width="570" height="80" rx="12" fill="#edf3ff" stroke="#426baa" stroke-width="1.6"/><text x="735.0" y="633.0" font-size="20" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="546">另存：原插件对象，以及“使用者 → 提供者”关系</text><text x="735.0" y="661.0" font-size="20" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="546">供停用、卸载保护和失败清理使用</text><path class="edge" d="M410 382 L315 382" stroke="#65758d" marker-end="url(#arrowink)"/><rect x="309.0" y="348" width="116" height="26" rx="4" fill="#fff" stroke="none" stroke-width="1.6"/><text x="367" y="364" font-size="17" text-anchor="middle" style="fill:#65758d;font-weight:400">调用生命周期</text><path class="edge" d="M315 345 L560 345 L560 300 L670 300" stroke="#65758d" marker-end="url(#arrowink)"/><rect x="355.285" y="308" width="241.42999999999995" height="28" rx="4" fill="#fff" stroke="none" stroke-width="1.6"/><text x="476" y="326" font-size="19" text-anchor="middle" style="fill:#65758d;font-weight:400">context.provide / get</text><path class="edge" d="M315 495 L670 495" stroke="#7954a7" marker-end="url(#arrowpurple)" stroke-dasharray="7 5"/><rect x="351.94500000000005" y="459" width="274.10999999999996" height="28" rx="4" fill="#fff" stroke="none" stroke-width="1.6"/><text x="489" y="477" font-size="19" text-anchor="middle" style="fill:#7954a7;font-weight:400">context.on / emit（方案）</text><text x="450" y="757" font-size="22" text-anchor="start" style="fill:#20304a;font-weight:600">用户操作时：查询到能力实现，然后直接调用普通函数</text><rect x="45" y="825" width="270" height="115" rx="12" fill="#f5f7fa" stroke="#7c8798" stroke-width="1.6"/><text x="180.0" y="875.5" font-size="20" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="246">页面</text><text x="180.0" y="903.5" font-size="20" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="246">core.get(saveKey) → save</text><rect x="415" y="825" width="285" height="115" rx="12" fill="#edf3ff" stroke="#426baa" stroke-width="1.6"/><text x="557.5" y="874.7" font-size="22" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="261">保存函数</text><text x="557.5" y="905.7" font-size="22" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="261">await write(document)</text><rect x="790" y="825" width="265" height="115" rx="12" fill="#eaf6ee" stroke="#33825d" stroke-width="1.6"/><text x="922.5" y="874.7" font-size="22" text-anchor="middle" style="fill:#20304a;font-weight:600" data-max-width="241">写入函数</text><text x="922.5" y="905.7" font-size="22" text-anchor="middle" style="fill:#5d6a7e;font-weight:400" data-max-width="241">负责实际写入文件</text><path class="edge" d="M315 882 L415 882" stroke="#65758d" marker-end="url(#arrowink)"/><rect x="314.35" y="846" width="101.3" height="27" rx="4" fill="#fff" stroke="none" stroke-width="1.6"/><text x="365" y="863" font-size="18" text-anchor="middle" style="fill:#65758d;font-weight:400">调用 save</text><path class="edge" d="M700 882 L790 882" stroke="#65758d" marker-end="url(#arrowink)"/><rect x="691.93" y="847" width="106.14" height="26" rx="4" fill="#fff" stroke="none" stroke-width="1.6"/><text x="745" y="863" font-size="17" text-anchor="middle" style="fill:#65758d;font-weight:400">调用 write</text><text x="450" y="987" font-size="20" text-anchor="start" style="fill:#7954a7;font-weight:400">写入成功后，保存函数主动 emit；上方 EventBus 按表调用监听。</text><text x="40" y="1052" font-size="19" text-anchor="start" style="fill:#5d6a7e;font-weight:400" data-max-width="1020">Core 不逐次代替业务执行；事件相关结构仍是尚未实现的方案。</text></svg>